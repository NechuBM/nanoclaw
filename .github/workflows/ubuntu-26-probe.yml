# TEMPORARY: probe for the ubuntu-latest move to Ubuntu 26.04 (from 2026-10-19).
# Runs the OS-dependent commands of release.yml, refresh-agent-image.yml and the
# pin-change path of verify-agent-image.yml, which a normal PR never reaches.
# No credentials, no writes. Remove before merge.
name: ubuntu-26-probe

on:
  pull_request:

permissions: {}

jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tools the workflows call
        run: |
          set -euo pipefail
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          for t in git jq gh aws python3 docker curl sha256sum gcc; do
            printf '%-10s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          git --version
          jq --version
          gh --version | head -n1
          aws --version
          python3 --version
          docker --version
          docker buildx version
          gcc --version | head -n1

      - name: python3 heredoc (refresh-agent-image, verify-agent-image)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          print(json.dumps({'tag': bool(re.fullmatch(r'[a-z0-9][a-z0-9.-]{0,60}', 'hardened-1'))}))
          PY

      - name: buildx imagetools + pull + inspect (verify-agent-image)
        run: |
          set -euo pipefail
          REF=public.ecr.aws/docker/library/alpine:3.20
          docker buildx imagetools inspect --raw "$REF" > "$RUNNER_TEMP/manifest.json"
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(sorted({e["platform"]["architecture"] for e in m["manifests"]}))' "$RUNNER_TEMP/manifest.json"
          docker pull -q "$REF"
          docker image inspect --format '{{.Os}}/{{.Architecture}}' "$REF"

      - name: cosign install into /usr/local/bin (verify-agent-image)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 -o /usr/local/bin/cosign
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign
          cosign version

      - name: git tag, describe and jq (release)
        run: |
          set -euo pipefail
          git fetch --force origin main:refs/remotes/origin/main --tags
          git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' origin/main
          git -c user.name=probe -c user.email=probe@example.invalid tag -a v0.0.0-probe HEAD -m probe
          test "$(git cat-file -t v0.0.0-probe)" = tag
          jq -n --arg sha "$(git rev-list -n 1 v0.0.0-probe)" '{exists: true, sha: $sha}'
          FLAGS=(--prerelease --latest=false)
          echo "${FLAGS[@]}"
